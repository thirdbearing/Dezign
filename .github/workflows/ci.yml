name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Lighthouse's canonical audit needs absolute URLs on the host it tests.
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3230
      - name: JS budget (PLAN §4)
        run: pnpm budget
      - name: Install Playwright Chromium
        run: pnpm --filter @grafish/web exec playwright install --with-deps chromium
      - name: E2E (desktop + mobile)
        run: pnpm e2e
      - name: Lighthouse CI (mobile, slow 4G)
        run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/.lighthouseci
          retention-days: 7
